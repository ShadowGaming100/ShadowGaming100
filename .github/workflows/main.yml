
name: Generate Profile Assets

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

  push:
    branches:
      - master
    paths:
      - README.md
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Generate All Profile Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        run: |
          mkdir -p assets
          mkdir -p assets/icons
          mkdir -p profile-3d-contrib

      # GitHub statistics cards
      - name: Generate GitHub statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ShadowGaming100
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: false

      # 3D contribution graphics
      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ShadowGaming100

      # Animated contribution snake
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShadowGaming100
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.gif?color_snake=%23ffffff&color_dots=%230d1117,%23333333,%23666666,%23aaaaaa,%23ffffff&color_background=%23050505

      # Trophy generation
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate GitHub trophies
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/ryo-ma/github-profile-trophy.git \
            "$RUNNER_TEMP/github-profile-trophy"

          cd "$RUNNER_TEMP/github-profile-trophy"

          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            ./render_svg.ts \
            ShadowGaming100 \
            "$GITHUB_WORKSPACE/assets/trophy.svg" \
            dark

      # Verify generated files
      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "assets/overview.light.svg"
            "assets/overview.dark.svg"
            "assets/contributions.light.svg"
            "assets/contributions.dark.svg"
            "assets/languages.light.svg"
            "assets/languages.dark.svg"
            "assets/github-snake.gif"
            "assets/trophy.svg"
            "profile-3d-contrib/profile-green-animate.svg"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing generated asset: $file"
              exit 1
            fi

            echo "Verified: $file"
          done

          if ! file assets/github-snake.gif | grep -qi 'GIF image data'; then
            echo "::error::Contribution snake is not a valid GIF."
            exit 1
          fi

          grep -q '<svg' assets/trophy.svg
          grep -q '<svg' profile-3d-contrib/profile-green-animate.svg

      # Commit generated assets
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg assets/*.gif profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi

          git commit -m "chore(profile): update generated profile assets [skip ci]"
          git push origin HEAD:master

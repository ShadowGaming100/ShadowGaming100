name: Generate Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [master, main]
    paths:
      - README.md
      - .github/workflows/main.yml
      - scripts/generate_assets.py

permissions:
  contents: write

# Never cancel a half-finished run; queue the next one instead.
concurrency:
  group: generate-profile-assets
  cancel-in-progress: false

env:
  PROFILE_USER: ShadowGaming100

jobs:
  generate:
    name: Generate All Profile Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        run: mkdir -p assets profile-3d-contrib

      # The real FreeHosts icon is downloaded here and embedded into the artwork,
      # so the graphics never depend on the site being up when GitHub renders them.
      - name: Download FreeHosts icon
        continue-on-error: true
        run: curl -fsSL --max-time 30 -o assets/freehosts-icon.png https://freehosts.eu/Src/icons/icon.png

      # Hero, headers, buttons, cards, stack, terminal, footer (local SVG art)
      - name: Generate README artwork
        run: python3 scripts/generate_assets.py

      # GitHub statistics cards (light + dark)
      - name: Generate GitHub statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ env.PROFILE_USER }}
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: false

      # 3D contribution graphics (animated green = light, night green = dark)
      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.PROFILE_USER }}

      # The classic snake that eats your contributions (animated GIF, light + dark)
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ env.PROFILE_USER }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake.dark.gif?palette=github-dark&color_snake=orange&color_background=#0d1117
            assets/snake.light.gif?palette=github-light&color_snake=orange&color_background=#ffffff

      # Trophies come from a third-party script, so a failure here must not
      # break the rest of the run. The last good trophy files stay in place.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate GitHub trophies
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/ryo-ma/github-profile-trophy.git \
            "$RUNNER_TEMP/trophy"
          cd "$RUNNER_TEMP/trophy"

          render() {
            local theme="$1" out="$2"
            deno run --allow-net --allow-env --allow-read --allow-write \
              ./render_svg.ts "$PROFILE_USER" "$RUNNER_TEMP/$out" "$theme"
            grep -q '<svg' "$RUNNER_TEMP/$out"
            cp "$RUNNER_TEMP/$out" "$GITHUB_WORKSPACE/assets/$out"
          }

          render darkhub  trophy.dark.svg
          render default  trophy.light.svg

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            assets/overview.light.svg assets/overview.dark.svg
            assets/contributions.light.svg assets/contributions.dark.svg
            assets/languages.light.svg assets/languages.dark.svg
            assets/snake.light.gif assets/snake.dark.gif
            assets/trophy.light.svg assets/trophy.dark.svg
            profile-3d-contrib/profile-green-animate.svg
            profile-3d-contrib/profile-night-green.svg
            assets/hero.light.svg
            assets/hero.dark.svg
            assets/typing.light.svg
            assets/typing.dark.svg
            assets/footer.light.svg
            assets/footer.dark.svg
            assets/stack.light.svg
            assets/stack.dark.svg
            assets/roles.light.svg
            assets/roles.dark.svg
            assets/featured.light.svg
            assets/featured.dark.svg
            assets/terminal.svg
            assets/headers/about.light.svg
            assets/headers/about.dark.svg
            assets/headers/roles.light.svg
            assets/headers/roles.dark.svg
            assets/headers/stack.light.svg
            assets/headers/stack.dark.svg
            assets/headers/featured.light.svg
            assets/headers/featured.dark.svg
            assets/headers/stats.light.svg
            assets/headers/stats.dark.svg
            assets/headers/world.light.svg
            assets/headers/world.dark.svg
            assets/headers/snake.light.svg
            assets/headers/snake.dark.svg
            assets/headers/trophies.light.svg
            assets/headers/trophies.dark.svg
            assets/buttons/github.light.svg
            assets/buttons/github.dark.svg
            assets/buttons/freehosts.light.svg
            assets/buttons/freehosts.dark.svg
            assets/buttons/contact.light.svg
            assets/buttons/contact.dark.svg
          )

          for f in "${required[@]}"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Missing or empty asset: $f"
              exit 1
            fi
            case "$f" in
              *.svg) grep -q '<svg' "$f" || { echo "::error::Not a valid SVG: $f"; exit 1; } ;;
            esac
            echo "OK: $f"
          done

          for g in assets/snake.light.gif assets/snake.dark.gif; do
            head -c 3 "$g" | grep -q 'GIF' || { echo "::error::$g is not a valid GIF"; exit 1; }
          done

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi

          git commit -m "chore(profile): update generated profile assets [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"


name: Generate Profile Assets

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master
    paths:
      - README.md
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Generate All Profile Assets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        run: |
          mkdir -p assets
          mkdir -p profile-3d-contrib

      # GitHub statistics
      - name: Generate GitHub statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ShadowGaming100
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: false

      # 3D contribution graphics
      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ShadowGaming100

      # Animated contribution snake as GIF
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShadowGaming100
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.gif?color_snake=%23ffffff&color_dots=%230d1117,%23333333,%23666666,%23aaaaaa,%23ffffff&color_background=%23050505

      # Generate trophies locally instead of relying on
      # the public GitHub Profile Trophy deployment.
      - name: Generate GitHub trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ShadowGaming100
          output_path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Check every locally generated README image
      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "assets/overview.light.svg"
            "assets/overview.dark.svg"
            "assets/contributions.light.svg"
            "assets/contributions.dark.svg"
            "assets/languages.light.svg"
            "assets/languages.dark.svg"
            "assets/github-snake.gif"
            "assets/trophy.svg"
            "profile-3d-contrib/profile-night-view.svg"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing generated asset: $file"
              exit 1
            fi

            echo "Verified: $file"
          done

          file assets/github-snake.gif

          if ! file assets/github-snake.gif | grep -qi GIF; then
            echo "::error::Contribution snake is not a valid GIF."
            exit 1
          fi

      # Commit everything in one commit
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/ profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi

          git commit -m "chore(profile): update profile graphics"
          git push origin HEAD:master

name: Generate Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [master, main]
    paths:
      - README.md
      - scripts/generate_profile.py
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: false

env:
  PROFILE_USER: ShadowGaming100

jobs:
  generate:
    name: Generate All Profile Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        run: mkdir -p assets profile-3d-contrib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download FreeHosts icon
        continue-on-error: true
        run: curl -fsSL --max-time 8 -o assets/freehosts-icon.png https://freehosts.eu/Src/icons/icon.png


      - name: Generate GitHub statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ env.PROFILE_USER }}
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: false


      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate GitHub trophies
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git "$RUNNER_TEMP/trophy"
          cd "$RUNNER_TEMP/trophy"

          render() {
            local theme="$1" out="$2"
            deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts "$PROFILE_USER" "$RUNNER_TEMP/$out" "$theme"
            grep -q '<svg' "$RUNNER_TEMP/$out"
            cp "$RUNNER_TEMP/$out" "$GITHUB_WORKSPACE/assets/$out"
          }

          render darkhub trophy.dark.svg
          render default trophy.light.svg

      - name: Generate and validate all profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.PROFILE_USER }}
        run: python scripts/generate_profile.py


      - name: Commit and push generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets profile-3d-contrib

          # GIFs may be matched by broad repository ignore rules. Force-add the
          # generated animations so their raw.githubusercontent.com URLs exist.
          # Explicitly stage every animated image; do not rely on broad add rules.
          find assets -maxdepth 1 -type f -name '*.gif' -print0 | xargs -0 -r git add -f --

          # Fail the workflow before committing if any README GIF was not generated.
          for gif in assets/hero.dark.gif assets/hero.light.gif assets/typing.dark.gif assets/typing.light.gif assets/terminal.gif assets/featured.dark.gif assets/featured.light.gif assets/snake.dark.gif assets/snake.light.gif; do            test -s "$gif" || { echo "::error::Missing generated GIF: $gif"; exit 1; }
            file "$gif"
            git ls-files --error-unmatch "$gif" >/dev/null 2>&1 || git add -f -- "$gif"
          done

          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi

          git commit -m "chore(profile): update generated profile assets [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

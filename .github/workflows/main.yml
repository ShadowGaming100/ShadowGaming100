name: Generate Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [master, main]
    paths:
      - README.md
      - .github/workflows/main.yml
      - scripts/generate_assets.py
      - scripts/generate_all_time.py
      - scripts/generate_snake.py
      - scripts/verify_assets.py

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: false

env:
  PROFILE_USER: ShadowGaming100

jobs:
  generate:
    name: Generate All Profile Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        run: mkdir -p assets profile-3d-contrib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download FreeHosts icon
        continue-on-error: true
        run: curl -fsSL --max-time 30 -o assets/freehosts-icon.png https://freehosts.eu/Src/icons/icon.png

      - name: Generate README artwork
        run: python scripts/generate_assets.py

      - name: Generate GitHub statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ env.PROFILE_USER }}
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: false

      - name: Generate 2026 contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.PROFILE_USER }}
          YEAR: "2026"

      - name: Save 2026 contribution graph
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-green-animate.svg
          test -s profile-3d-contrib/profile-night-green.svg
          cp profile-3d-contrib/profile-green-animate.svg profile-3d-contrib/profile-2026.svg
          cp profile-3d-contrib/profile-night-green.svg profile-3d-contrib/profile-night-2026.svg

      - name: Generate 2025 contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.PROFILE_USER }}
          YEAR: "2025"

      - name: Save 2025 contribution graph
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-green-animate.svg
          test -s profile-3d-contrib/profile-night-green.svg
          cp profile-3d-contrib/profile-green-animate.svg profile-3d-contrib/profile-2025.svg
          cp profile-3d-contrib/profile-night-green.svg profile-3d-contrib/profile-night-2025.svg

      - name: Generate complete all-time contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.PROFILE_USER }}
        run: python scripts/generate_all_time.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ env.PROFILE_USER }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake.dark.gif?palette=github-dark&color_snake=orange&color_background=#0d1117
            assets/snake.light.gif?palette=github-light&color_snake=orange&color_background=#ffffff

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate GitHub trophies
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git "$RUNNER_TEMP/trophy"
          cd "$RUNNER_TEMP/trophy"

          render() {
            local theme="$1" out="$2"
            deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts "$PROFILE_USER" "$RUNNER_TEMP/$out" "$theme"
            grep -q '<svg' "$RUNNER_TEMP/$out"
            cp "$RUNNER_TEMP/$out" "$GITHUB_WORKSPACE/assets/$out"
          }

          render darkhub trophy.dark.svg
          render default trophy.light.svg

      - name: Validate all README image references
        run: python scripts/verify_assets.py

      - name: Commit and push generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi

          git commit -m "chore(profile): update generated profile assets [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
